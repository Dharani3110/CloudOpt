# Reactive autoscaling (built-in HPA, CPU-based) -- baseline comparison point
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudopt-backend-hpa
  namespace: cloudopt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudopt-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
