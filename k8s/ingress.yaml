apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudopt-ingress
  namespace: cloudopt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["cloudopt.YOUR_DOMAIN_OR_NIP_IO"]
      secretName: cloudopt-tls
  rules:
    - host: cloudopt.YOUR_DOMAIN_OR_NIP_IO
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: cloudopt-backend, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: cloudopt-frontend, port: { number: 80 } }
