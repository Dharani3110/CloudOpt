# TEMPLATE ONLY -- never commit real secrets to git.
# Create the real secret imperatively instead, e.g.:
#   kubectl create secret generic cloudopt-secrets -n cloudopt \
#     --from-literal=MONGO_URI="mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/cloudopt" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# For production, prefer Sealed Secrets or External Secrets Operator over
# kubectl create secret, so the encrypted form CAN be committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: cloudopt-secrets
  namespace: cloudopt
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://CHANGE_ME:CHANGE_ME@cluster0.mongodb.net/cloudopt"
  JWT_SECRET: "CHANGE_ME_RANDOM_32_BYTE_HEX"
