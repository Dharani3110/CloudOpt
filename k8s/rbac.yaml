apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudopt-sa
  namespace: cloudopt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudopt-role
  namespace: cloudopt
rules:
  # Least-privilege: backend only needs to read its own pods/configmaps, nothing cluster-wide
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudopt-rolebinding
  namespace: cloudopt
subjects:
  - kind: ServiceAccount
    name: cloudopt-sa
    namespace: cloudopt
roleRef:
  kind: Role
  name: cloudopt-role
  apiGroup: rbac.authorization.k8s.io
