apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudopt-frontend
  namespace: {{ .Values.namespace }}
  labels: { app: cloudopt-frontend }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: { app: cloudopt-frontend }
  template:
    metadata:
      labels: { app: cloudopt-frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/cloudopt-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudopt-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: cloudopt-frontend }
  ports: [{ port: 80, targetPort: 80 }]
