apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudopt-ml-service
  namespace: {{ .Values.namespace }}
  labels: { app: cloudopt-ml-service }
spec:
  replicas: {{ .Values.mlService.replicaCount }}
  selector:
    matchLabels: { app: cloudopt-ml-service }
  template:
    metadata:
      labels: { app: cloudopt-ml-service }
    spec:
      containers:
        - name: ml-service
          image: "{{ .Values.image.registry }}/cloudopt-ml-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          resources: {{- toYaml .Values.mlService.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudopt-ml-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: cloudopt-ml-service }
  ports: [{ port: 8000, targetPort: 8000 }]
