apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudopt-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "5000"
  ML_SERVICE_URL: "http://cloudopt-ml-service:8000"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudopt-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MONGO_URI: {{ .Values.secrets.mongoUri | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
